name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.8"
      - run: uv sync --frozen --extra test --python "$(command -v python)"
      - run: make check BENCH_PYTHON="$(command -v python)"
      - run: make package-check BENCH_PYTHON="$(command -v python)"
