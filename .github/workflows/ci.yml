name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.8"
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv run --frozen lexbench-webfetch validate
      - run: uv build --sdist --wheel
      - name: Validate an isolated wheel installation
        run: |
          uv venv /tmp/lexbench-wheel --python ${{ matrix.python }}
          uv pip install --python /tmp/lexbench-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/lexbench-wheel/bin/lexbench-webfetch validate
